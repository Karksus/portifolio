# Netlify configuration for Pedro Serio's portfolio.
# Static site — no build step, no framework. Netlify serves the files as-is.

[build]
  publish = "."
  # @netlify/blobs (used by the contact function for dedup) requires Node 22.12+.
  [build.environment]
    NODE_VERSION = "22"

# Netlify Forms is enabled automatically when a <form data-netlify="true">
# is present in the deployed HTML. There is nothing to configure here, but the
# form must exist in the HTML *at deploy time*.
#
# The form's action is /.netlify/functions/contact, which Netlify routes to the
# function instead of the forms handler (the forms handler skips /.netlify/*
# and any path that has a function). The function validates, trims and
# de-duplicates, then POSTs the clean submission to "/" where Netlify Forms
# records it in the dashboard.

# --- Security headers -------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://static.cloudflareinsights.com;
      style-src 'self' https://fonts.googleapis.com;
      font-src https://fonts.gstatic.com;
      img-src 'self' data:;
      connect-src 'self' https://cloudflareinsights.com;
      form-action 'self';
      base-uri 'none';
      object-src 'none';
      frame-ancestors 'none'
    """

# --- Caching ----------------------------------------------------------------
# Fingerprinting doesn't exist for a hand-written static site, so keep asset
# caching moderate (1 week) rather than "immutable", to avoid serving stale
# images after an update. HTML stays revalidated (Netlify default).
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"