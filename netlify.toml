# Netlify configuration for Pedro Serio's portfolio.
# Static site — no build step, no framework. Netlify serves the files as-is.

[build]
  publish = "."

# Netlify Forms is enabled automatically when a <form data-netlify="true">
# is present in the deployed HTML. There is nothing to configure here, but the
# form must exist in the HTML *at deploy time*.
#
# There is intentionally no redirect for the form action: the form posts to
# /thanks/, which is a real page, and Netlify intercepts the POST to record it.

# --- Security headers -------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src https://fonts.gstatic.com;
      img-src 'self' data:;
      connect-src 'self';
      form-action 'self';
      base-uri 'none';
      object-src 'none';
      frame-ancestors 'none'
    """

# --- Caching ----------------------------------------------------------------
# Fingerprinting doesn't exist for a hand-written static site, so keep asset
# caching moderate (1 week) rather than "immutable", to avoid serving stale
# images after an update. HTML stays revalidated (Netlify default).
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800"